/* ─── Question renderer ─────────────────────────────────────────────────── */
function QField({ q, value, onChange, onToggle, practiceType = "Other" }) {
  const base = { width: "100%", boxSizing: "border-box", border: `1.5px solid ${LG}`, borderRadius: 8, padding: "10px 14px", fontSize: 14, fontFamily: "'DM Sans', sans-serif", background: WHITE, color: SLATE, outline: "none", transition: "border-color 0.15s" };
  const resolvedOptions = q.optionsByType
    ? (q.optionsByType[practiceType] || q.optionsByType["Other"] || [])
    : (q.options || []);
  if (q.type === "text") return (
    <input style={base} value={value || ""} placeholder={q.placeholder} onChange={e => onChange(q.id, e.target.value)}
      onFocus={e => e.target.style.borderColor = PURPLE} onBlur={e => e.target.style.borderColor = LG} />
  );
  if (q.type === "textarea") return (
    <textarea style={{ ...base, minHeight: 90, resize: "vertical", lineHeight: 1.65 }} value={value || ""} placeholder={q.placeholder}
      onChange={e => onChange(q.id, e.target.value)}
      onFocus={e => e.target.style.borderColor = PURPLE} onBlur={e => e.target.style.borderColor = LG} />
  );
  if (q.type === "select") return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
      {resolvedOptions.map(opt => {
        const sel = value === opt;
        return (
          <label key={opt} onClick={() => onChange(q.id, opt)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 13px", border: `1.5px solid ${sel ? PURPLE : LG}`, borderRadius: 8, cursor: "pointer", background: sel ? "rgba(83,74,183,0.07)" : WHITE, transition: "all 0.15s", color: SLATE, fontSize: 13, fontFamily: "'DM Sans', sans-serif", userSelect: "none" }}>
            <div style={{ width: 15, height: 15, borderRadius: "50%", border: `2px solid ${sel ? PURPLE : LG}`, background: sel ? PURPLE : "transparent", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
              {sel && <div style={{ width: 5, height: 5, borderRadius: "50%", background: WHITE }} />}
            </div>
            {opt}
          </label>
        );
      })}
    </div>
  );
  if (q.type === "multiselect") {
    const sel = Array.isArray(value) ? value : [];
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {resolvedOptions.map(opt => {
          const on = sel.includes(opt);
          return (
            <label key={opt} onClick={() => onToggle(q.id, opt)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 13px", border: `1.5px solid ${on ? PURPLE : LG}`, borderRadius: 8, cursor: "pointer", background: on ? "rgba(83,74,183,0.07)" : WHITE, transition: "all 0.15s", color: SLATE, fontSize: 13, fontFamily: "'DM Sans', sans-serif", userSelect: "none" }}>
              <div style={{ width: 15, height: 15, borderRadius: 4, border: `2px solid ${on ? PURPLE : LG}`, background: on ? PURPLE : "transparent", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
                {on && <span style={{ color: WHITE, fontSize: 9, fontWeight: 800 }}>✓</span>}
              </div>
              {opt}
            </label>
          );
        })}

/* ─── Score gauge ───────────────────────────────────────────────────────── */
function Gauge({ score, size = 110 }) {
  const r = (size / 2) - 10;
  const circ = 2 * Math.PI * r;
  const col = score >= 7 ? RED : score >= 5 ? GOLD : GREEN;
  const trackCol = score >= 7 ? "rgba(239,68,68,0.12)" : score >= 5 ? "rgba(245,158,11,0.12)" : "rgba(16,185,129,0.12)";
  return (
    <div style={{ textAlign: "center" }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={trackCol} strokeWidth={9} />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth={9}
          strokeDasharray={circ} strokeDashoffset={circ * (1 - score / 10)} strokeLinecap="round" style={{ transition: "stroke-dashoffset 1s ease" }} />
      </svg>
      <div style={{ marginTop: -size / 2 - 10, position: "relative", zIndex: 1, paddingBottom: size / 2 - 10 }}>
        <div style={{ fontSize: size === 110 ? 30 : 22, fontWeight: 700, color: NAVY, lineHeight: 1, fontFamily: "'Outfit', sans-serif" }}>{score}</div>
        <div style={{ fontSize: 11, color: MG, fontWeight: 500 }}>/10</div>
      </div>
      <div style={{ fontSize: 11, color: MG, marginTop: 4, fontFamily: "'DM Sans', sans-serif" }}>Opportunity Score</div>
    </div>
  );
}

/* ─── Root app ──────────────────────────────────────────────────────────── */
function App() {
  const [stage,      setStage]   = useState("intro");
  const [idx,        setIdx]     = useState(0);
  const [answers,    setAnswers] = useState({});
  const [data,       setData]    = useState(null);
  const [busy,       setBusy]    = useState(false);
  const [err,        setErr]     = useState(null);
  useEffect(() => {
    const el = document.createElement("link");
    el.rel = "stylesheet";
    el.href = "https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap";
    document.head.appendChild(el);
  }, []);
  const isLast = idx === SECTIONS.length - 1;
  const setAnswer  = (id, v)  => setAnswers(p => ({ ...p, [id]: v }));
  const toggleMulti = (id, v) => setAnswers(p => {
    const cur = Array.isArray(p[id]) ? p[id] : [];
    return { ...p, [id]: cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v] };
  });
  const buildSummary = () =>
    SECTIONS.map(s =>
      `## ${s.title}\n` + s.questions.map(q => {
        const a = answers[q.id];
        return `- ${q.label}: ${a ? (Array.isArray(a) ? (a.length ? a.join(", ") : "Not answered") : a) : "Not answered"}`;
      }).join("\n")
    ).join("\n\n");
  const generate = async () => {
    setBusy(true); setErr(null);
    try {
      const res  = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 8000,
          system: SYSTEM_PROMPT,
          messages: [{ role: "user", content: `Practice audit responses:\n\n${buildSummary()}` }]
        })
      });
      const json = await res.json();
      if (json.error) throw new Error(json.error.message);
      const raw = json.content[0].text.replace(/```json\n?|\n?```/g, "").trim();
      let parsed;
      try {
        parsed = JSON.parse(raw);
      } catch (parseErr) {
        const firstBrace = raw.indexOf("{");
        if (firstBrace === -1) throw new Error("No JSON object found in response");
        let trimmed = raw.slice(firstBrace);
        let depth = 0;
        let inStr = false;
        let escape = false;
        let lastCleanClose = 0;
        for (let i = 0; i < trimmed.length; i++) {
          const c = trimmed[i];
          if (escape) { escape = false; continue; }
          if (c === "\\") { escape = true; continue; }
          if (c === '"' && !escape) { inStr = !inStr; continue; }
          if (inStr) continue;
          if (c === "{" || c === "[") depth++;
          if (c === "}" || c === "]") { depth--; if (depth === 0) lastCleanClose = i; }
        }
        if (depth > 0) {
          let closing = "";
          for (let d = depth; d > 0; d--) closing += "}";
          trimmed = trimmed.slice(0, lastCleanClose + 1);
          const lastComma = trimmed.lastIndexOf(",");
          if (lastComma > trimmed.length * 0.5) {
            trimmed = trimmed.slice(0, lastComma) + "}";
          } else {
            trimmed += closing;
          }
        }
        parsed = JSON.parse(trimmed);
      }
      setData(parsed);
      setStage("presentation");
    } catch (e) {
      setErr(`Error generating report: ${e.message}. Please try again.`);
    }
    setBusy(false);
  };
  if (busy)                              return <Generating />;
  if (stage === "intro")                 return <Intro onStart={() => setStage("audit")} />;
  if (stage === "presentation" && data)  return <Presentation data={data} onRestart={() => { setStage("intro"); setAnswers({}); setData(null); setIdx(0); }} />;
  return (
    <AuditForm
      idx={idx}
      answers={answers}
      setAnswer={setAnswer}
      toggleMulti={toggleMulti}
      isLast={isLast}
      err={err}
      onBack={()  => idx > 0 ? setIdx(i => i - 1) : setStage("intro")}
      onNext={()  => isLast ? generate() : setIdx(i => i + 1)}
    />
  );
}
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
