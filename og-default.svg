<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="1200" height="630" fill="#030A12"/>

  <!-- Subtle dot grid background -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="rgba(83,74,183,0.12)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Decorative arc top-right -->
  <path d="M 1050 80 A 200 200 0 0 1 1150 280" stroke="rgba(69,196,188,0.15)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 1070 80 A 180 180 0 0 1 1150 260" stroke="rgba(69,196,188,0.08)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Decorative arc bottom-left -->
  <path d="M 150 550 A 200 200 0 0 1 50 350" stroke="rgba(83,74,183,0.12)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 130 550 A 180 180 0 0 1 50 370" stroke="rgba(83,74,183,0.07)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Logo mark — scaled up for OG image -->
  <g transform="translate(440, 240) scale(2.8)">
    <path d="M28.83,18.02 A34,34 0 1 1 28.83,-18.02" fill="none" stroke="#534AB7" stroke-width="3.5" stroke-linecap="butt"/>
    <path d="M17.81,11.13 A21,21 0 1 1 17.81,-11.13" fill="none" stroke="#45C4BC" stroke-width="2.2" stroke-linecap="butt"/>
    <path d="M8.9,5.56 A10.5,10.5 0 1 1 8.9,-5.56" fill="none" stroke="#DCE0EC" stroke-width="1.7" stroke-linecap="butt"/>
    <line x1="-34" y1="-1.93" x2="-34" y2="1.93" stroke="#534AB7" stroke-width="2.27" stroke-linecap="butt"/>
    <line x1="-21" y1="-1.21" x2="-21" y2="1.21" stroke="#45C4BC" stroke-width="1.43" stroke-linecap="butt"/>
    <line x1="-10.5" y1="-0.94" x2="-10.5" y2="0.94" stroke="#DCE0EC" stroke-width="1.1" stroke-linecap="butt"/>
  </g>

  <!-- Wordmark text -->
  <text x="600" y="360" font-family="Outfit,sans-serif" font-weight="700" font-size="72" fill="#DCE0EC" letter-spacing="-1" text-anchor="middle">Clinevo</text>

  <!-- Divider line -->
  <line x1="420" y1="380" x2="780" y2="380" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Tagline -->
  <text x="600" y="410" font-family="DM Sans,sans-serif" font-weight="300" font-size="18" fill="#45C4BC" letter-spacing="6" text-anchor="middle">AI FOR CLINICS THAT CARE.</text>

  <!-- Subtext -->
  <text x="600" y="460" font-family="DM Sans,sans-serif" font-weight="400" font-size="16" fill="rgba(220,224,236,0.4)" text-anchor="middle">clinevo.ai</text>
</svg>
